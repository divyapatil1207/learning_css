<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     div{
        width: 150px;
        height: 150px;
        background-color: brown;
        position: relative;
        border-radius: 50%;
        animation: movingcircle;
        animation-duration: 5s;
        animation-iteration-count:infinite;
        animation-delay: 2s;
        animation-direction:alternate;

    }
    .bg_img{
    background-image: url("../img/butterfly.jpg");
    background-repeat: no-repeat;
    background-size: contain;
}
     @keyframes movingcircle{ 
         0%{background-color: brown;left:0px;top:0px ;} 
         25%{background-color: purple;left:0px;top:0px ;} 
         50%{background-color: orangered;left:0px;top:0px ;} 
         75%{background-color: green;left:0px;top:0px;} 
        100%{background-color: chartreuse;left:0px;top:0;} 
    
    }  
    </style>
</head>
<body class="bg_img">
    <div></div>
    
    
</body>
</html>
