<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadows</title>
    <style>
        .b_shadow{
             box-shadow: 7px 8px 9px red;
        }
        .b_shadow{
            width: 500px;
            box-shadow: 6px 7px 8px blue;
        }
        .d_shadow{
            width: 500px;
            filter: drop-shadow(8px 9px 10px blue);
        }
        
    </style>
</head>
<body>
    <img class="b_shadow" src="img/butterfly.jpg" alt="..."/>

    <img src="img/tree.png" class="d_shadow"/>
    <!-- <img src="img/crown.png" class="d_shadow2"/> -->



</body>
</html>
